name: Feature request
description: Suggest a condition, pricing option or Admin improvement.
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who needs this (merchant, shopper, developer) and what can't they do today? If a Magento table rate module does it, describe how it works there.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What you'd like
      description: How it should work. If you know the rateRequest field it needs, mention it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this.
